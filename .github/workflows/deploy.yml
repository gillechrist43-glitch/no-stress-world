name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Expo web
        env:
          REACT_APP_REMOTE_API: 'true'
          REACT_APP_REMOTE_API_URL: ${{ secrets.REACT_APP_REMOTE_API_URL != '' && secrets.REACT_APP_REMOTE_API_URL || 'https://your-backend-url.railway.app' }}
        run: npx expo export:web

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
